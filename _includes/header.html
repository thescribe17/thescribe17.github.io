<header class="site-header">
  <nav class="nav-bar">
    <div class="nav-left">
      <a href="{{ '/' | relative_url }}" class="site-title">
        {{ site.title }}
      </a>
    </div>

    <button class="nav-toggle" aria-label="Toggle navigation">
      &#9776;
    </button>

    <div class="nav-menu">
      {% for link in site.nav_links.right %}
        <a href="{{ link.url | relative_url }}" class="nav-link">
          {{ link.title }}
        </a>
      {% endfor %}
    </div>
  </nav>
</header>
