title: "The Desk of Karen Lee Field"
description: "Author of fantasy adventure and middle-grade mystery fiction."
baseurl: ""
url: "https://www.karenleefield.com"

markdown: kramdown
theme: null

date_format: "%-d %B %Y"

collections:
  books:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

paginate: 10
paginate_path: "/blog/page:num"

permalink: /:categories/:year/:month/:day/:title/

# Exclude these files from production site
exclude:
  - CNAME
  - README.md
